<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta content="IE=edge" http-equiv="X-UA-Compatible">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Document</title>
</head>

<body>
  <button>点击</button>
  <script>
    // 普通函数：  谁调用我，this就指向谁
    console.log(this)  // window
    function fn () {
      console.log(this)  // window
    }

    window.fn()
    window.setTimeout(function () {
      console.log(this) // window
    }, 1000)
    document.querySelector('button').addEventListener('click', function () {
      console.log(this)  // 本层没有 this 往上层找  --指向调用者  button
    })
    const obj = {
      sayHi: function () {
        console.log(this)  // 本层没有 this 往上层找  --指向 obj
      },
    }
    obj.sayHi()
  </script>
</body>

</html>
